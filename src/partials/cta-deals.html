    <!-- =================================================================
         SLOT-CTA DEALS (blogartikels over de Koninklijke deals)

         /koninklijke-deals, dus hier nooit naar /reserveren linken.
         ================================================================= -->
    <section class="amk-cta" data-amk-rise aria-labelledby="amk-cta-title">

      <div class="amk-container amk-cta__inner">
        <p class="amk-eyebrow" data-amk-reveal>Koninklijke deals</p>

          <a class="amk-btn amk-btn--gold amk-btn--shine amk-btn--lg" href="/koninklijke-deals" data-amk-magnetic>{{i:crown}}Bekijk de winterdeals</a>
          <a class="amk-btn amk-btn--ghost amk-btn--lg" href="tel:{{TEL}}">{{i:phone}}{{PHONE}}</a>
